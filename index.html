<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tavistock Drive — Aston Martin DB5</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#0b1220; font-family:Arial, sans-serif; }
  #hud {
    position:fixed; left:14px; top:14px; z-index:10; color:#fff;
    background:rgba(10,16,28,.72); padding:12px 14px; border-radius:12px;
    border:1px solid rgba(255,255,255,.14); min-width:230px;
    backdrop-filter:blur(7px);
  }
  #hud h1 { margin:0 0 6px; font-size:16px; letter-spacing:.4px; }
  #hud p { margin:3px 0; font-size:12px; opacity:.9; }
  #speed { font-size:22px; font-weight:bold; color:#7fd4ff; }
  #controls {
    position:fixed; right:14px; bottom:14px; z-index:10; color:#fff;
    background:rgba(10,16,28,.72); padding:10px 12px; border-radius:12px;
    border:1px solid rgba(255,255,255,.14); font-size:12px; max-width:270px;
  }
  #loading {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:#0b1220; color:#fff; font-size:18px; letter-spacing:1px;
  }
  #minimap {
    position:fixed; right:14px; top:14px; z-index:10; width:190px; height:190px;
    border-radius:12px; border:1px solid rgba(255,255,255,.2);
    background:rgba(8,14,24,.8);
  }
  kbd {
    background:#1c2942; border:1px solid #3a4d70; border-radius:4px;
    padding:1px 5px; font-family:monospace; font-size:11px;
  }
</style>
</head>
<body>

<div id="loading">Loading Tavistock…</div>

<div id="hud">
  <h1>TAVISTOCK DRIVE</h1>
  <p>Aston Martin DB5</p>
  <p><span id="speed">0</span> mph</p>
  <p id="location">Bedford Square</p>
  <p id="objective">Explore the town and find all 6 landmarks</p>
</div>

<canvas id="minimap" width="380" height="380"></canvas>

<div id="controls">
  <b>Controls</b><br />
  <kbd>W</kbd>/<kbd>↑</kbd> Accelerate<br />
  <kbd>S</kbd>/<kbd>↓</kbd> Brake / reverse<br />
  <kbd>A</kbd>/<kbd>D</kbd> Steer<br />
  <kbd>Space</kbd> Handbrake<br />
  <kbd>C</kbd> Camera view<br />
  <kbd>R</kbd> Reset car
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------------- Core setup ---------------- */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9dc4e0);
scene.fog = new THREE.Fog(0x9dc4e0, 160, 520);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 1400);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xfff3d6, 2.1);
sun.position.set(90, 140, 55);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -220;
sun.shadow.camera.right = 220;
sun.shadow.camera.top = 220;
sun.shadow.camera.bottom = -220;
sun.shadow.camera.far = 500;
scene.add(sun);

scene.add(new THREE.HemisphereLight(0xbdd7ff, 0x4a5b42, 0.85));

/* ---------------- Tavistock-inspired layout ---------------- */

const world = new THREE.Group();
scene.add(world);

const groundMat = new THREE.MeshStandardMaterial({ color:0x5f7a45, roughness:1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1100, 1100), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
world.add(ground);

function road(x, z, w, d, rot=0) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.08, d),
    new THREE.MeshStandardMaterial({ color:0x2f3238, roughness:.9 })
  );
  m.position.set(x, 0.04, z);
  m.rotation.y = rot;
  m.receiveShadow = true;
  world.add(m);
  return m;
}

function pavement(x, z, w, d, rot=0) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.16, d),
    new THREE.MeshStandardMaterial({ color:0xb9b3a5, roughness:.95 })
  );
  m.position.set(x, 0.08, z);
  m.rotation.y = rot;
  m.receiveShadow = true;
  world.add(m);
  return m;
}

function building(x, z, w, h, d, colour, rot=0, roofColour=0x513f31) {
  const g = new THREE.Group();

  const body = new THREE.Mesh(
    new RoundedBoxGeometry(w, h, d, 2, 0.25),
    new THREE.MeshStandardMaterial({ color:colour, roughness:.82 })
  );
  body.position.y = h/2;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(Math.max(w,d)*0.74, h*0.42, 4),
    new THREE.MeshStandardMaterial({ color:roofColour, roughness:.85 })
  );
  roof.position.y = h + h*0.2;
  roof.rotation.y = Math.PI/4;
  roof.castShadow = true;
  g.add(roof);

  // Windows
  const winMat = new THREE.MeshStandardMaterial({
    color:0x24384d, metalness:.35, roughness:.15, emissive:0x0d1b2a
  });
  const rows = Math.max(1, Math.floor(h/4));
  const cols = Math.max(1, Math.floor(w/3.4));
  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      const win = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.6, .12), winMat);
      win.position.set(
        -w/2 + (c+0.5)*(w/cols),
        2.3 + r*3.2,
        d/2 + 0.03
      );
      g.add(win);

      const win2 = win.clone();
      win2.position.z = -d/2 - 0.03;
      g.add(win2);
    }
  }

  g.position.set(x, 0, z);
  g.rotation.y = rot;
  world.add(g);
  return g;
}

function tree(x, z, scale=1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.35,.5,3.4,8),
    new THREE.MeshStandardMaterial({ color:0x533b26, roughness:1 })
  );
  trunk.position.y = 1.7;
  trunk.castShadow = true;
  g.add(trunk);

  const leafMat = new THREE.MeshStandardMaterial({ color:0x336b2c, roughness:1 });
  for (let i=0; i<3; i++) {
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(1.8 + Math.random()*.8, 1), leafMat);
    blob.position.set((Math.random()-.5)*1.3, 3.6+i*1.15, (Math.random()-.5)*1.3);
    blob.castShadow = true;
    g.add(blob);
  }
  g.position.set(x, 0, z);
  g.scale.setScalar(scale);
  world.add(g);
  return g;
}

function lamp(x, z) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(.09,.13,6,8),
    new THREE.MeshStandardMaterial({ color:0x222831, metalness:.6, roughness:.4 })
  );
  pole.position.y = 3;
  pole.castShadow = true;
  g.add(pole);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(.38, 16, 12),
    new THREE.MeshStandardMaterial({ color:0xffe9a8, emissive:0xffd479, emissiveIntensity:.8 })
  );
  head.position.y = 6.1;
  g.add(head);
  g.position.set(x, 0, z);
  world.add(g);
}

// Main roads: A386/Plymouth Road, Duke Street, West Street, Market Road, King Street
road(0, 0, 900, 18);              // A386 / Plymouth Road east-west
road(-30, 0, 18, 420);            // Duke Street north-south
road(60, 90, 16, 300);            // West Street
road(120, -70, 15, 320);          // Market Road
road(-110, 110, 14, 300);         // King Street
road(-220, -100, 300, 15);        // Canal-side route
road(180, 150, 320, 16);          // Old Exeter Road

pavement(0, 12, 900, 4);
pavement(0, -12, 900, 4);
pavement(-42, 0, 4, 420);
pavement(-18, 0, 4, 420);

/* Bedford Square */
const square = new THREE.Mesh(
  new THREE.CylinderGeometry(38, 38, .12, 48),

);
square.position.set(0, .09, 0);
square.receiveShadow = true;
world.add(square);

);
squareCentre.position.set(0, .6, 0);
squareCentre.castShadow = true;
world.add(squareCentre);

const statueBase = new THREE.Mesh(

const drake = new THREE.Mesh(

/* Landmark buildings */
const townHall = building(-55, -35, 34, 18, 22, 0x9a8f77, 0, 0x4a3a2d);
townHall.name = 'Tavistock Town Hall';

const guildhall = building(-55, 35, 22, 13, 18, 0x938872, 0, 0x43332a);
guildhall.name = 'Guildhall';

const church = building(28, -28, 26, 22, 18, 0xa79a80, 0, 0x4b3a2c);
church.name = 'St Eustachius’ Church';

const market = building(35, 35, 38, 11, 24, 0xa8997c, 0, 0x54402f);
market.name = 'Pannier Market';

const abbey = building(-95, -20, 30, 10, 20, 0x8d8271, 0, 0x4d3d30);
abbey.name = 'Tavistock Abbey remains';

const bedfordHotel = building(90, -35, 30, 14, 18, 0x9d8f74, 0, 0x4e3b2c);
bedfordHotel.name = 'Bedford Hotel';

/* River Tavy and Meadows */
const river = new THREE.Mesh(
  new THREE.PlaneGeometry(900, 55),
  new THREE.MeshStandardMaterial({
    color:0x2f6d80, metalness:.35, roughness:.18,
    transparent:true, opacity:.92
  })
);
river.rotation.x = -Math.PI/2;
river.position.set(-260, .12, 120);
world.add(river);

const meadow = new THREE.Mesh(
  new THREE.PlaneGeometry(210, 170),
  new THREE.MeshStandardMaterial({ color:0x5c8340, roughness:1 })
);
meadow.rotation.x = -Math.PI/2;
meadow.position.set(-230, .1, 40);
world.add(meadow);

for (let i=0; i<80; i++) {
  tree(
    -320 + Math.random()*190,
    -40 + Math.random()*170,
    .7 + Math.random()*.8
  );
}

/* Dartmoor-style hills and Brent Tor in the distance */
function hill(x, z, radius, height, colour=0x5d7448) {
  const h = new THREE.Mesh(
    new THREE.ConeGeometry(radius, height, 7),
    new THREE.MeshStandardMaterial({ color:colour, roughness:1, flatShading:true })
  );
  h.position.set(x, height/2 - 2, z);
  h.castShadow = true;
  h.receiveShadow = true;
  world.add(h);
  return h;
}

hill(380, -260, 130, 48);
hill(430, -90, 100, 34);
hill(-380, -240, 150, 42);
hill(-450, 190, 120, 36);
hill(430, 300, 110, 30);

const brentTor = hill(510, -330, 55, 58, 0x4f6244);
const torChurch = new THREE.Mesh(
  new THREE.BoxGeometry(7, 12, 7),
  new THREE.MeshStandardMaterial({ color:0xbdb4a2, roughness:.85 })
);
torChurch.position.set(510, 54, -330);
torChurch.castShadow = true;
world.add(torChurch);

/* Street furniture and trees around centre */
for (let i=0; i<24; i++) {
  const a = i/24*Math.PI*2;
  lamp(Math.cos(a)*34, Math.sin(a)*34);
}
for (let i=0; i<18; i++) {
  const a = i/18*Math.PI*2;
  tree(Math.cos(a)*46, Math.sin(a)*46, .8+Math.random()*.5);
}

/* ---------------- Aston Martin DB5 ---------------- */

const car = new THREE.Group();
world.add(car);

const paint = new THREE.MeshPhysicalMaterial({
  color:0x0f4f75, metalness:.82, roughness:.22,
  clearcoat:1, clearcoatRoughness:.08
});
const chrome = new THREE.MeshStandardMaterial({
  color:0xd8dde3, metalness:1, roughness:.18
});
const glass = new THREE.MeshPhysicalMaterial({
  color:0x0a1622, metalness:.1, roughness:.05,
  transparent:true, opacity:.72
});
const tyreMat = new THREE.MeshStandardMaterial({ color:0x0d0d0f, roughness:.95 });
const interior = new THREE.MeshStandardMaterial({ color:0x40241d, roughness:.85 });

// Main body
const lowerBody = new THREE.Mesh(new RoundedBoxGeometry(4.7, .85, 10.2, 3, .38), paint);
lowerBody.position.y = .82;
lowerBody.castShadow = true;
car.add(lowerBody);

const upperBody = new THREE.Mesh(new RoundedBoxGeometry(4.15, .62, 7.6, 3, .35), paint);
upperBody.position.set(0, 1.48, -.25);
upperBody.castShadow = true;
car.add(upperBody);

// Bonnet, boot and detailing
const bonnet = new THREE.Mesh(new RoundedBoxGeometry(3.85, .28, 3.1, 2, .2), paint);
bonnet.position.set(0, 1.75, 3.1);
bonnet.castShadow = true;
car.add(bonnet);

const boot = new THREE.Mesh(new RoundedBoxGeometry(3.9, .3, 2.5, 2, .2), paint);
boot.position.set(0, 1.72, -3.5);
boot.castShadow = true;
car.add(boot);

const grille = new THREE.Mesh(new RoundedBoxGeometry(2.7, .55, .25, 2, .1), chrome);
grille.position.set(0, 1.05, 5.08);
car.add(grille);

const bumperF = new THREE.Mesh(new RoundedBoxGeometry(4.4, .28, .35, 2, .12), chrome);
bumperF.position.set(0, .78, 5.15);
car.add(bumperF);

const bumperR = new THREE.Mesh(new RoundedBoxGeometry(4.4, .28, .35, 2, .12), chrome);
bumperR.position.set(0, .78, -5.15);
car.add(bumperR);

// Windscreen and side glass
const windscreen = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.25, .12), glass);
windscreen.position.set(0, 2.05, 1.55);
windscreen.rotation.x = -.42;
car.add(windscreen);

const rearScreen = new THREE.Mesh(new THREE.BoxGeometry(3.1, .95, .12), glass);
rearScreen.position.set(0, 2.0, -2.1);
rearScreen.rotation.x = .45;
car.add(rearScreen);

for (const sx of [-2.03, 2.03]) {
  const sideGlass = new THREE.Mesh(new THREE.BoxGeometry(.1, .75, 3.6), glass);
  sideGlass.position.set(sx, 1.98, -.35);
  car.add(sideGlass);
}

// Roof
const roof = new THREE.Mesh(new RoundedBoxGeometry(3.35, .22, 3.9, 2, .18), paint);
roof.position.set(0, 2.42, -.35);
roof.castShadow = true;
car.add(roof);

// Interior hint
const seats = new THREE.Mesh(new RoundedBoxGeometry(2.7, .35, 2.5, 2, .15), interior);
seats.position.set(0, 1.72, -.7);
car.add(seats);

// Headlights, tail lights, indicators
function light(x, y, z, colour, intensity=2.5, size=.24) {
  const l = new THREE.Mesh(
    new THREE.SphereGeometry(size, 14, 10),
    new THREE.MeshStandardMaterial({
      color:colour, emissive:colour, emissiveIntensity:intensity
    })
  );
  l.position.set(x, y, z);
  car.add(l);
}
light(-1.45, 1.18, 5.05, 0xfff2c0);
light(1.45, 1.18, 5.05, 0xfff2c0);
light(-1.5, 1.15, -5.1, 0xff2a22, 2.2, .2);
light(1.5, 1.15, -5.1, 0xff2a22, 2.2, .2);
light(-2.05, 1.1, 4.95, 0xffa62b, 1.5, .12);
light(2.05, 1.1, 4.95, 0xffa62b, 1.5, .12);

// DB5-style wheels
const wheels = [];
const wheelPositions = [
  [-2.25, .62, 3.15],
  [2.25, .62, 3.15],
  [-2.25, .62, -3.25],
  [2.25, .62, -3.25]
];

for (const [x,y,z] of wheelPositions) {
  const g = new THREE.Group();

  const tyre = new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.42,24), tyreMat);
  tyre.rotation.z = Math.PI/2;
  tyre.castShadow = true;
  g.add(tyre);

  const rim = new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.45,18), chrome);
  rim.rotation.z = Math.PI/2;
  g.add(rim);

  for (let i=0; i<5; i++) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(.06,.56,.08), chrome);
    spoke.rotation.x = i/5*Math.PI;
    g.add(spoke);
  }

  g.position.set(x,y,z);
  car.add(g);

}

// Number plates
const plateMat = new THREE.MeshStandardMaterial({ color:0xf4f2e6, roughness:.6 });
const plateF = new THREE.Mesh(new THREE.BoxGeometry(1.35,.34,.06), plateMat);
plateF.position.set(0,.78,5.2);
car.add(plateF);

const plateR = plateF.clone();
plateR.position.z = -5.2;
car.add(plateR);

/* ---------------- Game state ---------------- */

const carState = {
  x: 12, z: 20,
  angle: Math.PI,
  speed: 0,
  steer: 0
};

const maxSpeed = 42;
const reverseMax = -13;
const acceleration = 21;
const brakePower = 36;
const friction = 8.5;
const steerSpeed = 2.1;

const keys = {};
let cameraMode = 0;

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyC') cameraMode = (cameraMode + 1) % 3;
  if (e.code === 'KeyR') resetCar();
});
addEventListener('keyup', e => keys[e.code] = false);

function resetCar() {
  carState.x = 12;
  carState.z = 20;
  carState.angle = Math.PI;
  carState.speed = 0;
}

/* ---------------- Landmark discovery ---------------- */

const landmarks = [
  { name:'Bedford Square & Drake Statue', x:0, z:0, found:false },
  { name:'Tavistock Town Hall', x:-55, z:-35, found:false },
  { name:'Guildhall', x:-55, z:35, found:false },
  { name:'St Eustachius’ Church', x:28, z:-28, found:false },
  { name:'Pannier Market', x:35, z:35, found:false },
  { name:'Abbey remains', x:-95, z:-20, found:false }
];

function updateLandmarks() {
  let found = 0;
  let nearest = null;
  let nearestDist = Infinity;

  for (const l of landmarks) {
    const d = Math.hypot(carState.x-l.x, carState.z-l.z);
    if (d < 24) l.found = true;
    if (l.found) found++;
    if (d < nearestDist) {
      nearestDist = d;
      nearest = l;
    }
  }

  document.getElementById('location').textContent =
    nearest ? `Near: ${nearest.name}` : 'Tavistock';

  document.getElementById('objective').textContent =
    found === landmarks.length
      ? 'All landmarks discovered — enjoy the drive!'
      : `Explore the town and find all ${landmarks.length} landmarks (${found}/${landmarks.length})`;
}

/* ---------------- Minimap ---------------- */

const mm = document.getElementById('minimap').getContext('2d');

function drawMinimap() {
  mm.clearRect(0,0,380,380);
  mm.fillStyle = 'rgba(8,14,24,.9)';
  mm.fillRect(0,0,380,380);

  const scale = .55;
  const cx = 190;
  const cy = 190;

  function toMap(x,z) {
    return [cx + x*scale, cy + z*scale];
  }

  // Roads
  mm.strokeStyle = '#3c4658';
  mm.lineWidth = 9;
  const roads = [
    [-450,0,450,0],
    [-30,-210,-30,210],
    [60,-60,60,240],
    [120,-230,120,90],
    [-110,-40,-110,260],
    [-370,-100,-70,-100],
    [20,150,340,150]
  ];
  for (const [x1,z1,x2,z2] of roads) {
    const [ax,ay] = toMap(x1,z1);
    const [bx,by] = toMap(x2,z2);
    mm.beginPath();
    mm.moveTo(ax,ay);
    mm.lineTo(bx,by);
    mm.stroke();
  }

  // Landmarks
  for (const l of landmarks) {
    const [x,y] = toMap(l.x,l.z);
    mm.beginPath();
    mm.arc(x,y,5,0,Math.PI*2);
    mm.fillStyle = l.found ? '#59d98c' : '#ffd166';
    mm.fill();
  }

  // Car
  const [x,y] = toMap(carState.x, carState.z);
  mm.save();
  mm.translate(x,y);
  mm.rotate(-carState.angle);
  mm.fillStyle = '#7fd4ff';
  mm.beginPath();
  mm.moveTo(0,-9);
  mm.lineTo(6,8);
  mm.lineTo(-6,8);
  mm.closePath();
  mm.fill();
  mm.restore();
}

/* ---------------- Physics and animation ---------------- */

const clock = new THREE.Clock();

function updateCar(dt) {
  const forward = (keys.KeyW || keys.ArrowUp) ? 1 : 0;
  const back = (keys.KeyS || keys.ArrowDown) ? 1 : 0;
  const left = (keys.KeyA || keys.ArrowLeft) ? 1 : 0;
  const right = (keys.KeyD || keys.ArrowRight) ? 1 : 0;
  const handbrake = keys.Space ? 1 : 0;

  if (forward) carState.speed += acceleration*dt;
  if (back) carState.speed -= (carState.speed > 0 ? brakePower : acceleration*.6)*dt;

  if (!forward && !back) {
    const drag = friction*dt;
    if (carState.speed > 0) carState.speed = Math.max(0, carState.speed-drag);
    else carState.speed = Math.min(0, carState.speed+drag);
  }

  if (handbrake) carState.speed *= Math.max(0, 1-4.5*dt);

  carState.speed = Math.max(reverseMax, Math.min(maxSpeed, carState.speed));

  const targetSteer = (left ? 1 : 0) - (right ? 1 : 0);
  carState.steer += (targetSteer - carState.steer) * Math.min(1, dt*7);

  const speedFactor = Math.min(1, Math.abs(carState.speed)/16);
  carState.angle += carState.steer * steerSpeed * dt * speedFactor * Math.sign(carState.speed || 1);

  const dx = Math.sin(carState.angle) * carState.speed * dt;
  const dz = Math.cos(carState.angle) * carState.speed * dt;
  carState.x += dx;
  carState.z += dz;

  // Soft boundary
  const limit = 480;
  carState.x = Math.max(-limit, Math.min(limit, carState.x));
  carState.z = Math.max(-limit, Math.min(limit, carState.z));

  car.position.set(carState.x, 0, carState.z);
  car.rotation.y = carState.angle;

  // Wheel animation
  const wheelSpin = carState.speed*dt*3.2;
  for (let i=0; i<wheels.length; i++) {
    wheels[i].rotation.x -= wheelSpin;
    if (i < 2) wheels[i].rotation.y = carState.steer*.42;
  }

  // Slight body roll
  car.rotation.z = -carState.steer * speedFactor * .05;
  car.position.y = Math.sin(clock.elapsedTime*9)*0.012*Math.abs(carState.speed)/maxSpeed;
}

function updateCamera(dt) {
  const target = new THREE.Vector3(carState.x, 2, carState.z);

  if (cameraMode === 0) {
    // Chase camera
    const back = 13.5;
    const height = 5.4;
    const camX = carState.x - Math.sin(carState.angle)*back;
    const camZ = carState.z - Math.cos(carState.angle)*back;
    camera.position.lerp(new THREE.Vector3(camX, height, camZ), Math.min(1, dt*5));
    camera.lookAt(target.x, 1.6, target.z);
  } else if (cameraMode === 1) {
    // Bonnet cam
    camera.position.set(
      carState.x + Math.sin(carState.angle)*1.2,
      2.35,
      carState.z + Math.cos(carState.angle)*1.2
    );
    camera.lookAt(
      carState.x + Math.sin(carState.angle)*25,
      2,
      carState.z + Math.cos(carState.angle)*25
    );
  } else {
    // Cinematic orbit
    const t = clock.elapsedTime*.25;
    camera.position.set(
      carState.x + Math.cos(t)*17,
      7.5,
      carState.z + Math.sin(t)*17
    );
    camera.lookAt(target.x, 1.4, target.z);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(.05, clock.getDelta());

  updateCar(dt);
  updateCamera(dt);
  updateLandmarks();
  drawMinimap();

  document.getElementById('speed').textContent =
    Math.abs(Math.round(carState.speed*2.237));

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('loading').style.display = 'none';
animate();
</script>
</body>
</html>
